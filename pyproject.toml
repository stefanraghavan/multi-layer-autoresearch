[project]
name = "multi-layer-autoresearch"
version = "0.1.0"
description = "Three-layer autonomous research system for daily stock direction prediction"
requires-python = ">=3.11"

dependencies = [
    "openai>=1.82.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "yfinance>=0.2.30",
    "PyYAML>=6.0.1",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "fds.sdk.utils>=1.0.0",
    "fds.sdk.FactSetFundamentals==3.1.0",
    "fds.sdk.EventsandTranscripts>=2.1.1",
    "fds.sdk.FactSetEstimates==3.1.0",
    "fds.sdk.FactSetGlobalPrices>=1.0.0",
]

[tool.setuptools]
packages = ["lib"]
